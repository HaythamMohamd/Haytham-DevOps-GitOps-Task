stages:
  - build
  - test
  - scan_dep
  - build_docker
  - image_scan
  - docker_push
  - deploy


variables:
  IMAGE_REPOSITORY: docker.io/haytham1992/django-ecommerce
  IMAGE_TAG: $CI_PIPELINE_IID
  IMAGE_NAME: $IMAGE_REPOSITORY:$IMAGE_TAG


build:
  stage: build
  image: python:3.8-bullseye
  before_script:
    - python -m pip install pip==23.0.1 setuptools==57.5.0 wheel==0.38.4
    # - python -m pip install pip setuptools wheel
  script:
    - python -m pip install -r requirements.txt
    - python manage.py check

unit_tests:
  stage: test
  image: python:3.8-bullseye
  before_script:
    - pip install setuptools==57.5.0 wheel
    - pip install -r requirements.txt
    - pip install pytest
  # script:
  #   - pytest
  script:
    - python manage.py check
    - |
      status=0
      pytest || status=$?
      if [ "$status" -eq 5 ]; then
        echo "No tests found yet; skipping pytest failure."
      elif [ "$status" -ne 0 ]; then
        exit "$status"
      fi

scan_dep:
  stage: scan_dep
  image: python:3.8-bullseye
  script:
    - pip install pip-audit
    - pip-audit || true

build_docker:
  stage: build_docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t $IMAGE_NAME .
    - docker save -o image.tar $IMAGE_NAME
  artifacts:
    paths:
      - image.tar


image_scan:
  stage: image_scan
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  dependencies:
    - build_docker
  before_script:
    - apk add --no-cache curl
    - wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
    - mv ./bin/trivy /usr/local/bin/
    - docker load -i image.tar
  script:
  - trivy image --exit-code 1 --severity HIGH,CRITICAL $IMAGE_NAME || true


docker_push:
  stage: docker_push
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  dependencies:
    - build_docker
    - image_scan
  before_script:
    - docker load -i image.tar
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker push $IMAGE_NAME

deploy_staging:
  stage: deploy
  tags:
    - local-mac-runner
  image: bitnami/kubectl:latest
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - route -n get 192.168.252.2
    - nc -vz 192.168.252.2 6443
    - kubectl get nodes
    - kubectl apply -f manifests/deployment.yml
